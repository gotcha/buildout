[buildout]
# These paths are relative to the current buildout config.
download-cache = ../downloads
eggs-directory = ../eggs
parts = testscript
newest = false
testeggs =

[versions]
zc.buildout =
# Diverges from the verbatim upstream fixture (>= 6.0.0a1): zc.recipe.egg
# 6.0.0 declares zc.buildout>=6.0.0; this checkout ships 5.3.0a3.dev0, so
# resolution must stay below the 6.x line until the branch converges on 6.x
# itself (same pin as .github/workflows/scripts.cfg).
zc.recipe.egg = < 6.0.0

[testscript]
recipe = zc.recipe.egg
interpreter = testscript
eggs = ${buildout:testeggs}
