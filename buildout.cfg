[buildout]
develop = zc.recipe.egg_ .
parts = test test-buildout test-recipe py
versions = versions
eggs-directory = eggs
download-cache = downloads

[versions]
zope.interface = 4.1.3
zope.exceptions = 4.0.8
zc.recipe.testrunner = 2.0.0
zope.testing = 4.9
coverage = 5.1

[versions:python_version >= "3.13"]
zope.interface = 7.0.3
zope.exceptions = 5.1
zc.recipe.testrunner = 3.1
zope.testing = 5.0.1
coverage = 7.6.1

[versions:python_version >= "3.14"]
zope.interface = 8.1.1

[versions:python_version < "3.10"]
# The latest runner-side tooling dropped 3.9: zope.testrunner 8.2+,
# pytest 9+, ZConfig 4.3+ declare requires_python >=3.10, so their
# pip-mode installs fail outright on a 3.9 leg.  Pin the last
# 3.9-compatible releases for that cell.  (The section condition is a
# PEP 508 marker, so "3.9" < "3.10" compares versions, not strings.)
# zc.recipe.egg stays unpinned: it is a develop project in this
# buildout, which shields it from index resolution — pinning it made
# the suite glob the STALE egg docs instead of the develop checkout's.
# pytest's iniconfig dependency is unpinned and 2.3.x dropped 3.9 too;
# the egg resolver picks candidates without consulting requires_python
# and leaves the rejection to the install leg.
zope.testrunner = 8.1
pytest = 8.4.2
ZConfig = 4.2
iniconfig = 2.1.0

[py]
recipe = zc.recipe.egg
eggs = zc.buildout[test]
       zc.recipe.egg
       coverage
       pytest
       pytest-xdist
interpreter = py

[test-environment]
PIP_NO_PYTHON_VERSION_WARNING = 1
PIP_DISABLE_PIP_VERSION_CHECK = 1

[test]
recipe = zc.recipe.testrunner
eggs =
  zc.buildout[test]
  zc.recipe.egg
defaults = ['-s', 'zc.buildout', '-s', 'zc.recipe.egg']
environment = test-environment

[test-buildout]
<= test
defaults = ['-s', 'zc.buildout']

[test-recipe]
<= test
defaults = ['-s', 'zc.recipe.egg']
