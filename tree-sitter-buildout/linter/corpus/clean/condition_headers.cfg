# Conditional section headers, ported from the reference parser's own test
# suite (src/zc/buildout/tests/configparser.test) — old-style Python
# expressions (opaque condition_body) and PEP 508 markers (structured
# marker_expression) side by side. Section names are uniquified: repeated
# conditional variants of one name are covered in ../warnings/duplicate_section.cfg.
[buildout]
parts = demo

# old-style: comment containing brackets after the header
[s1: 2 + 2 == 4] # this expression is true [therefore this section will be kept]
x = 1

# old-style: whitespace around the colon, bracket inside the comment
[   s2 : 2 + 2 == 5  ]         # comment: this section would be ignored]
x = 1

# old-style: lambda and list comprehension
[s3:2 in map(lambda i:i*2, [i for i in range(10)])] ;# Complex expressions are [possible!];, though they should not be (abused:)
x = 1

# old-style: escaped hash/semicolon literals and brackets inside strings
[s4:2 in map(lambda i:i*2, ['''\x23\x3b)'''] + [i for i in range(10)] + list('\x23[]][\x3b\x23'))] # escaped \x23 and \x3b in literals
x = 1

# old-style: function calls, tuples, subscripts
[s5: str(platform.python_version_tuple()[0]) in ('2', '3',)]
x = 1

[s6:sys.version[0] == '0']
x = 1

[s7:len(platform.uname()) > 0]
x = 1

# old-style: module booleans from _default_globals
[s8: sys and re and os and platform]
x = 1

[s9: any([python2, python3, python310, python311, python312, python313, python314, python315]) ]
x = 1

[s10:cpython or pypy or jython or ironpython]
x = 1

[s11:linux or windows or cygwin or macosx or solaris or posix or True]
x = 1

[s12:bits32 or bits64 or little_endian or big_endian]
x = 1

# PEP 508 markers: structured marker_expression nodes
[m1: python_version < "2.6"]
x = 1

[m2: python_version >= "2.0" and platform_system != "msdos"]
x = 1

[m3: python_version >= "2.0" or platform_system == "msdos"]
x = 1

[m4: python_version in "3.13"]
x = 1

[m5: "nt" in os_name]
x = 1

[m6: python_full_version not in "3.9.0"]
x = 1

[m7: python_version === "3.12.0"]
x = 1

[m8: (python_version >= "3.9" and platform_system == "Linux") or os_name == "posix"]
x = 1

[demo]
recipe = zc.recipe.egg
