name: Windows

on:
  # Called from run-tests.yml so Windows stays in the push gate, and
  # from test-uv.yml with installer: uv for the uv pipeline variant.
  # Dispatchable on its own for Windows-only debugging loops once this
  # file reaches the default branch (dispatch registers from there):
  #   gh workflow run windows.yml --ref <branch>
  # Until then the Windows-only loop is windows-iter.yml, which works
  # from any branch via its push trigger.
  workflow_call:
    inputs:
      installer:
        description: "Install pipeline under test: 'pip' runs make plus make pytest, 'uv' runs make test-uv"
        type: string
        default: 'pip'
  workflow_dispatch:
    inputs:
      installer:
        description: "Install pipeline under test: 'pip' runs make plus make pytest, 'uv' runs make test-uv"
        type: string
        default: 'pip'

jobs:
  windows:
    # Exception to the devenv rule: Nix does not run on Windows
    # runners, so this job keeps actions/setup-python and the
    # pip-cached bootstrap. It still drives the repo-owned entry
    # points (`make`, `make pytest`). The uv variant needs no extra
    # provisioning: uv is a declared zc.buildout dependency, so the
    # venv pip install lays uv.exe next to the Python executable,
    # where easy_install._uv_executable finds it after the PATH miss.
    name: ${{ inputs.installer == 'uv' && 'Windows (uv installer)' || format('Windows (uv {0})', matrix.uv-pin) }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10"]
        setuptools-version: ["75.8.2"]
        # PROBE (windows-iter only): the bisect showed all of
        # 0.12.11/0.12.17/0.12.24/0.13.0 failing; single cell keeps the
        # iteration loop cheap while the venv-nesting probe runs.
        uv-pin: ["0.12.24"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
    - name: Run tests
      if: inputs.installer != 'uv'
      env:
        PYTHONWARNINGS: ignore
        PYTHON_VERSION: ${{matrix.python-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
        # PROBE: exact uv under test (bisects the Windows PEP 660
        # editable build-isolation failure on windows-iter).
        UV_PIN: ${{ matrix.uv-pin }}
        # Defining temporary directories is needed on Windows for
        # test_all.TestEasyInstall.test_move_to_eggs_dir_and_compile
        TMPDIR: C:\tmp
        TMP: C:\tmp
        TEMP: C:\tmp
      # PROBE: prepare + buildout only, no doctest suite.
      run: make bin/test
    - name: Probe build-env venv nesting 2 (windows-iter debug)
      shell: bash
      run: |
        set -x
        set +e
        ROOT="$(pwd -W)"
        UV="$ROOT/venvs/python/Scripts/uv.exe"
        PY="$ROOT/venvs/python/Scripts/python3.exe"
        SEED_N="$ROOT/downloads/test-seed"
        FSLASH() { echo "${1//\\//}"; }
        rm -rf /tmp/p4 && mkdir -p /tmp/p4/pkg/src/demo_pep660
        {
          printf '[build-system]\nrequires = ["hatchling"]\nbuild-backend = "hatchling.build"\n\n'
          printf '[project]\nname = "demo-pep660"\nversion = "0.1.0"\n'
        } > /tmp/p4/pkg/pyproject.toml
        printf 'def main():\n    pass\n' > /tmp/p4/pkg/src/demo_pep660/__init__.py
        T4="$(cd /tmp/p4 && pwd -W)"
        PKG_N="$T4/pkg"
        mkdest() { mkdir -p "$1"; (cd "$1" && pwd -W); }
        freshcache() { local c; c="$(mktemp -d)"; (cd "$c" && pwd -W); }
        hermetic_env() {
          export PIP_NO_INDEX=1
          export PIP_FIND_LINKS="$SEED_N"
          export UV_FIND_LINKS="$SEED_N"
          export UV_INDEX_URL="file:///$(FSLASH "$1")/nonexistent-hermetic-index"
          export UV_NO_PROGRESS=1
        }

        echo "===== E2f: control, fixed hermetic index (expect resolve OK, build-env loss) ====="
        C1="$(freshcache)"
        hermetic_env "$C1"
        export UV_CACHE_DIR="$C1"
        DEST="$(mkdest /tmp/p4/d-ctrl)"
        "$UV" pip install --no-deps -t "$DEST" --python "$PY" -v -e "file:///$(FSLASH "$PKG_N")" 2>&1 | tail -25
        echo "E2f rc=${PIPESTATUS[0]}"

        echo "===== E3x: uv venv identity on a REAL base interpreter ====="
        BASEP="$("$PY" -c 'import sys; print(sys.base_prefix)')"
        BASEP="$(FSLASH "$BASEP")"
        REAL="$BASEP/python.exe"
        echo "REAL=$REAL"
        C2="$(freshcache)"; hermetic_env "$C2"; export UV_CACHE_DIR="$C2"
        "$UV" venv --python "$REAL" "$T4/nested-real"
        NESTR="$T4/nested-real/Scripts/python.exe"
        "$NESTR" -c "import sys; print('exe:', sys.executable); print('prefix:', sys.prefix); print('base_prefix:', sys.base_prefix)"
        "$UV" pip install --python "$NESTR" hatchling 2>&1 | tail -3
        "$NESTR" -c "import hatchling; print('hatchling at', hatchling.__file__)"
        echo "E3x import rc=$?"

        echo "===== W1f: editable install with --python = real base ====="
        C3="$(freshcache)"; hermetic_env "$C3"; export UV_CACHE_DIR="$C3"
        DEST="$(mkdest /tmp/p4/d-w1)"
        "$UV" pip install --no-deps -t "$DEST" --python "$REAL" -v -e "file:///$(FSLASH "$PKG_N")" 2>&1 | tail -25
        echo "W1f rc=${PIPESTATUS[0]}"

        echo "===== W2f: --no-build-isolation + PYTHONPATH preseeded backend ====="
        C4="$(freshcache)"; hermetic_env "$C4"; export UV_CACHE_DIR="$C4"
        BLD="$(mkdest /tmp/p4/bld)"
        "$UV" pip install -t "$BLD" --python "$PY" hatchling 2>&1 | tail -5
        echo "W2f preseed rc=${PIPESTATUS[0]}"
        DEST="$(mkdest /tmp/p4/d-w2)"
        PYTHONPATH="$(FSLASH "$BLD")" "$UV" pip install --no-deps --no-build-isolation -t "$DEST" --python "$PY" -v -e "file:///$(FSLASH "$PKG_N")" 2>&1 | tail -20
        echo "W2f rc=${PIPESTATUS[0]}"
        exit 0
    - name: Run tests (uv installer)
      if: inputs.installer == 'uv'
      env:
        PYTHONWARNINGS: ignore
        PYTHON_VERSION: ${{matrix.python-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
        # Defining temporary directories is needed on Windows for
        # test_all.TestEasyInstall.test_move_to_eggs_dir_and_compile
        TMPDIR: C:\tmp
        TMP: C:\tmp
        TEMP: C:\tmp
      run: make test-uv
    - name: Run pytest suite
      # the uv variant runs make test-uv only: there is no uv variant of
      # the pytest step
      if: inputs.installer != 'uv'
      # bash, not the default pwsh: the Makefile pytest recipe is POSIX sh
      # (command substitution). Under pwsh, make has to discover Git's
      # sh.exe on PATH itself, and PWD is not exported.
      shell: bash
      env:
        PYTHONWARNINGS: ignore
        PYTHON_VERSION: ${{matrix.python-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
        # Defining temporary directories is needed on Windows for
        # test_all.TestEasyInstall.test_move_to_eggs_dir_and_compile
        TMPDIR: C:\tmp
        TMP: C:\tmp
        TEMP: C:\tmp
      # PROBE: only the PEP 660 develop file (the failing class).
      run: bin/py -m pytest src/zc/buildout/tests/pytests/test_develop_pep660.py -v
