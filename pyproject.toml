[tool.ty.src]
# _vendor is frozen third-party code (the pkg_resources v81 fork):
# not gateable signal, excluded from the static tier.
# etc/tracing is a MonkeyType driver used with an ad-hoc monkeytype
# install; the gate venv intentionally lacks it.
# dagger is a Dagger SDK module (own pyproject, generated sdk/ dir);
# the repo venv has no dagger-io to check it against. It is verified
# by running it (dagger call), not statically.
exclude = ["src/zc/buildout/_vendor", "etc/tracing", "dagger"]

[tool.pytest.ini_options]
# src/zc is a namespace package (no __init__.py). Without this, pytest's
# default import mode walks up only to zc/buildout and imports the ported
# test modules as buildout.tests.*: a second, alias copy of the package
# next to the real zc.buildout.* one, which also defeats name-based
# coverage matching (source = zc.buildout).
consider_namespace_packages = true

[tool.ruff]
# The repo supports Python 3.9+ (setup.py python_requires).
target-version = "py39"

[tool.ruff.lint]
# The classic ruff default set (pyflakes F + pycodestyle E4/E7/E9),
# fully enforced: the burndown is done, the ignore list is empty.
# (ruff >= 0.16 defaults to a much wider set; pin the baseline here so
# `make lint` means the same thing across ruff versions.)
select = ["E4", "E7", "E9", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Ported doctest writes a buildout.cfg containing `${...}` substitutions
# and applies `% dict` for legacy reasons; a mapping argument with no
# %-placeholder is a deliberate no-op, not a bug.
"src/zc/buildout/tests/pytests/test_pytest_buildout_doctests.py" = ["F507"]
# Deliberate unused imports: import-availability probes in try/except
# and public re-exports. __init__.py also has load-bearing import
# order (do-not-reorder comment in the file): the distutils-hack
# finder removal before the pip import, warning filters before the
# pkg_resources deprecation surfaces.
"src/zc/buildout/__init__.py" = ["F401", "E402"]
"src/zc/buildout/easy_install.py" = ["F401"]
"src/zc/buildout/patches.py" = ["F401"]
"zc.recipe.egg_/src/zc/recipe/egg/__init__.py" = ["F401"]
# Packaging entry point: name and version assignments ahead of the
# setuptools import.
"setup.py" = ["E402"]
# Packaging entry point: name and version assignments ahead of the
# setuptools import.
"zc.recipe.egg_/setup.py" = ["E402"]
# Puts its own directory on sys.path to import the sibling gen_pytest
# module as a script.
"src/zc/buildout/tests/pytests/inject_prose.py" = ["E402"]
# Deliberate late import after pkg_resources.working_set.add_entry;
# the file carries an isort do-not-move note on that line.
"dev.py" = ["E402"]

[tool.towncrier]
filename = "CHANGES.rst"
directory = "news/"
title_format = "{version} ({project_date})"
underlines = ["-", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "develop"
name = "Development:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests:"
showcontent = true
