[tool.ty.src]
# _vendor is frozen third-party code (the pkg_resources v81 fork):
# not gateable signal, excluded from the static tier.
# etc/tracing is a MonkeyType driver used with an ad-hoc monkeytype
# install; the gate venv intentionally lacks it.
exclude = ["src/zc/buildout/_vendor", "etc/tracing"]

[tool.towncrier]
filename = "CHANGES.rst"
directory = "news/"
title_format = "{version} ({project_date})"
underlines = ["-", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "develop"
name = "Development:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests:"
showcontent = true
