[tool.ty.src]
# _vendor is frozen third-party code (the pkg_resources v81 fork):
# not gateable signal, excluded from the static tier.
# etc/tracing is a MonkeyType driver used with an ad-hoc monkeytype
# install; the gate venv intentionally lacks it.
exclude = ["src/zc/buildout/_vendor", "etc/tracing"]

[tool.ruff]
# The repo supports Python 3.9+ (setup.py python_requires).
target-version = "py39"

[tool.ruff.lint]
# Pragmatic baseline for a legacy tree: the classic ruff default set
# (pyflakes F + pycodestyle E4/E7/E9) minus the rules the existing code
# violates wholesale. Everything else stays enforced for new code —
# tighten by removing entries from `ignore` as the code gets cleaned.
# (ruff >= 0.16 defaults to a much wider set; pin the baseline here so
# `make lint` means the same thing across ruff versions.)
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # module-level import not at top (sys.path dance)
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E731",  # assign a lambda expression
    "E722",  # bare except
    "E741",  # ambiguous variable name (l, O, ...)
    "F811",  # redefinition (pytest port class injection)
    "F841",  # unused local variable (incl. __doing__ frame locals)
]

[tool.ruff.lint.per-file-ignores]
# Ported doctest writes a buildout.cfg containing `${...}` substitutions
# and applies `% dict` for legacy reasons; a mapping argument with no
# %-placeholder is a deliberate no-op, not a bug.
"src/zc/buildout/tests/pytests/test_pytest_buildout_doctests.py" = ["F507"]
# Deliberate unused imports: import-availability probes in try/except
# and public re-exports.
"src/zc/buildout/__init__.py" = ["F401"]
"src/zc/buildout/easy_install.py" = ["F401"]
"src/zc/buildout/patches.py" = ["F401"]
"zc.recipe.egg_/src/zc/recipe/egg/__init__.py" = ["F401"]

[tool.towncrier]
filename = "CHANGES.rst"
directory = "news/"
title_format = "{version} ({project_date})"
underlines = ["-", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "develop"
name = "Development:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests:"
showcontent = true
